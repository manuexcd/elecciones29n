name: Contrato de fuentes

# Llama de verdad a las fuentes externas y comprueba que su formato no ha cambiado.
# Diario ahora; durante la campaña (13-27 nov) cámbialo a cada hora: "7 * * * *".
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de contrato
        run: ./gradlew contractTest --no-daemon
