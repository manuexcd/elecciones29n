name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Si commiteas el wrapper (`gradle wrapper`), cambia `gradle` por `./gradlew` y quita gradle-version.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Tests (sin llamar a fuentes reales)
        run: gradle test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Tras commitear package-lock.json: usa `npm ci` y activa `cache: npm` en setup-node.
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
