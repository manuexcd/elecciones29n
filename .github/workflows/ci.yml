name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Usa la versión de Gradle del wrapper (gradle/wrapper/gradle-wrapper.properties) y cachea dependencias.
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests (sin llamar a fuentes reales)
        run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Falla si frontend/src/lib/api-types.ts no coincide con el OpenAPI que genera el backend
  # (se cambió un record de Java y no se ejecutó `npm run gen:api`).
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Arrancar el backend
        working-directory: backend
        run: |
          ./gradlew bootJar --no-daemon
          java -jar build/libs/*.jar > backend.log 2>&1 &
          # El precalentado de las cachés puede fallar sin red; /v3/api-docs no depende de las fuentes.
          for i in $(seq 60); do curl -sf http://localhost:8080/v3/api-docs > /dev/null && exit 0; sleep 2; done
          cat backend.log; exit 1
      - name: Regenerar tipos y comparar
        working-directory: frontend
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code src/lib/api-types.ts

  docker:
    needs: [backend, frontend, api-types]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }} (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
